# Every action is pinned to a commit. The comment gives the tag.
# The release workflow calls this one, so a tag gets the same checks.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The Lean proofs of crates/rules (lean/README.md).
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: lean/.lake
          key: lake-${{ hashFiles('lean/lake-manifest.json', 'lean/lean-toolchain', 'lean/lakefile.toml') }}
      - name: Build the proofs
        working-directory: lean
        run: |
          lake exe cache get
          lake build

  # The committed Lean must be what Aeneas makes from the current Rust, so a proof never
  # speaks about old code. A change to crates/rules that the proofs do not cover fails here.
  lean-extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Read the Aeneas pin
        id: pin
        run: echo "rev=$(sed -n 's/^rev = "\(.*\)"/\1/p' lean/lakefile.toml)" >> "$GITHUB_OUTPUT"
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: 5.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: aeneas-cache
        with:
          path: ~/aeneas
          key: aeneas-${{ steps.pin.outputs.rev }}-v1
      - name: Build Aeneas and Charon at the pin
        if: steps.aeneas-cache.outputs.cache-hit != 'true'
        run: |
          opam install -y calendar core_unix domainslib easy_logging menhir \
            ocamlformat.0.27.0 ocamlgraph odoc ppx_deriving ppx_deriving_yojson \
            progress unionFind visitors yojson zarith
          # setup-ocaml makes a local switch in the repo directory, so load its
          # environment before the cd.
          eval "$(opam env)"
          git clone https://github.com/AeneasVerif/aeneas.git ~/aeneas
          cd ~/aeneas
          git checkout "${{ steps.pin.outputs.rev }}"
          make setup-charon
          make
      - name: Install the Charon toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' ~/aeneas/charon/rust-toolchain)
          rustup toolchain install "$channel" --profile minimal \
            --component rustc-dev,llvm-tools,rust-src
      - name: Extract, and compare with the committed Lean
        run: |
          AENEAS=~/aeneas lean/extract.sh
          git diff --exit-code -- lean/Timeways/Types.lean lean/Timeways/Funs.lean

  # The release ships programs for these systems too. They cost the most minutes, so
  # they run only for a tag and in the nightly job.
  rust-os:
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - run: cargo build --release --locked --bin timeways-story --bin timeways-pack
      - run: cargo test --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-deny
      - run: cargo deny check

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The API gate lives in Gnomish Relay. Its pin moves with the shared transport.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: eserilev/gnomish-relay
          ref: 111884e06be7a1387262df72ee44da38acdbd3e1
          path: target/gnomish-relay
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: stylua,selene
      - run: stylua --check addon
      - run: selene addon/Timeways
      # Every WoW name that the addon uses must be in the pinned client.
      - run: >
          target/gnomish-relay/scripts/wow-api.sh --addon addon/Timeways --lint wow.yml
          --fake addon/tests/wow.lua --api addon/tests/api.lua
          --signatures addon/tests/api-signatures.lua
      - run: git diff --exit-code -- addon/tests/api.lua addon/tests/api-signatures.lua
      # The shared transport is a copy of the pinned relay commit (relay SPEC.md 9.7,
      # decision 14). A change goes to the relay first, then the pin moves.
      # The fake bridge of the tests builds on the same relay commit.
      # Each crate that uses the relay must name the same commit.
      - run: |
          grep -q 'gnomish-relay' crates/fake-bridge/Cargo.toml crates/addon-tests/Cargo.toml
          ! grep -h 'gnomish-relay' crates/*/Cargo.toml | grep -v 'rev = "111884e06be7a1387262df72ee44da38acdbd3e1"'
      - run: |
          for file in Sha256 Codec Saved Health Strip Slots Messages KeyHandoff; do
            diff -u target/gnomish-relay/addon/transport/$file.lua addon/Timeways/$file.lua
          done
          diff -u target/gnomish-relay/addon/tests/bit.lua addon/tests/bit.lua

  # Timeways speaks MSP with the MSP code of MyRolePlay, at the pin in scripts/fetch-mrp.sh
  # (docs/plans/msp.md, section 4). A move of the pin shows a change of the protocol.
  mrp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - run: scripts/fetch-mrp.sh
      - run: cargo test --locked -p addon-tests --test msp_mrp -- --ignored

  # A short run of every target on one machine. The nightly job runs them long.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-fuzz
      - run: scripts/fuzz.sh 30
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz
          path: fuzz/artifacts/

  # The release steps after the build, on fake programs. A tag runs the real ones.
  release-dry-run:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      # The packager reads the tags and the history for the version.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          args: -d -n "{package-name}-dry-run"
          pandoc: "false"
      - run: scripts/release-dry-run.sh .release/Timeways-dry-run.zip
