# Every action is pinned to a commit. The comment gives the tag.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [input, store, answers, json_lua, pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-fuzz
      - run: scripts/fuzz.sh 600 ${{ matrix.target }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
