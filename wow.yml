# The WoW API that the addon uses, for selene. Lua 5.1 plus these globals.
# The API gate of Gnomish Relay (scripts/wow-api.sh) checks each one against the real Forever client.
base: lua51
globals:
  C_Timer:
    any: true
  DEFAULT_CHAT_FRAME:
    any: true
  SlashCmdList:
    property: new-fields
  SLASH_TIMEWAYSLORE1:
    property: full-write
  CreateFrame:
    args: [{type: string}, {type: any, required: false}, {type: any, required: false}, {type: any, required: false}]
  UIParent:
    any: true
  UISpecialFrames:
    property: new-fields
  SLASH_TIMEWAYSTALK1:
    property: full-write
  SLASH_TIMEWAYSHERO1:
    property: full-write
  StaticPopupDialogs:
    property: new-fields
  StaticPopup_Show:
    args: [{type: string}, {type: any, required: false}, {type: any, required: false}, {type: any, required: false}]
  SLASH_TIMEWAYSJOURNAL1:
    property: full-write
  SLASH_TIMEWAYSJOURNAL2:
    property: full-write
  date:
    args: [{type: string}, {type: number, required: false}]
  GetRealmName:
    args: []
  GetRealZoneText:
    args: []
  GetSubZoneText:
    args: []
  C_GossipInfo:
    any: true
  GetGreetingText:
    args: []
  GetQuestText:
    args: []
  GetObjectiveText:
    args: []
  GetProgressText:
    args: []
  GetRewardText:
    args: []
  GetTitleText:
    args: []
  ItemTextGetCreator:
    args: []
  ItemTextGetItem:
    args: []
  ItemTextGetText:
    args: []
  UnitGUID:
    args:
      - type: string
  UnitClassification:
    args:
      - type: string
  issecretvalue:
    args:
      - type: any
  C_ChatInfo:
    any: true
  hooksecurefunc:
    args: [{type: any}, {type: any, required: false}, {type: any, required: false}]
  C_DeathRecap:
    any: true
  UnitExists:
    args:
      - type: string
  UnitPlayerControlled:
    args:
      - type: string
  UnitIsPlayer:
    args:
      - type: string
  UnitLevel:
    args:
      - type: string
  UnitName:
    args:
      - type: string
  time:
    args: []
  bit:
    struct: BitLib
  C_AddOns:
    any: true
  C_CVar:
    any: true
  SOUNDKIT:
    any: true
  UIErrorsFrame:
    any: true
  GameTooltip:
    any: true
  ActionStatus:
    any: true
  ChatFontNormal:
    any: true
  GetTime:
    args: []
  GetBuildInfo:
    args: []
  GetPhysicalScreenSize:
    args: []
  InCombatLockdown:
    args: []
  ReloadUI:
    args: []
  Screenshot:
    args: []
  PlaySound:
    args: [{type: any}]
  SetCVar:
    args: [{type: string}, {type: any}]
  strtrim:
    args: [{type: string}]
  unpack:
    args: [{type: table}, {type: number, required: false}, {type: number, required: false}]
structs:
  BitLib:
    band: {args: [{type: number}, {type: "..."}]}
    bor: {args: [{type: number}, {type: "..."}]}
    bxor: {args: [{type: number}, {type: "..."}]}
    bnot: {args: [{type: number}]}
    lshift: {args: [{type: number}, {type: number}]}
    rshift: {args: [{type: number}, {type: number}]}
