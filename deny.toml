[graph]
# The desktop targets of the story program. The WebAssembly build of SQLite brings its own crates.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]

[licenses]
# Unicode-3.0 is the data license of `unicode-ident`, which the serde derive macros use.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/eserilev/rusty-hourglass"]
