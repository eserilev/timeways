[workspace]
resolver = "3"
members = ["crates/story", "crates/rules", "crates/addon-tests", "crates/fake-bridge"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/eserilev/timeways"

[workspace.dependencies]
timeways-rules = { path = "crates/rules" }
rusty-hourglass = { git = "https://github.com/eserilev/rusty-hourglass", rev = "dea7d40918e20386dfb92eedf6c3a6c660fba321" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
proptest = "1"
quick-xml = "0.42"
regex = "1"
sevenz-rust2 = { version = "0.23", default-features = false }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(charon)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# Its fix, `assert_eq!(x, [] as [T; 0])`, reads worse than `assert!(x.is_empty())`.
assert_is_empty = "allow"
