[workspace]
resolver = "3"
members = ["crates/story", "crates/addon-tests"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/eserilev/timeways"

[workspace.dependencies]
rusty-hourglass = { git = "https://github.com/eserilev/rusty-hourglass", rev = "f1a7bb45b3e4c009789c6f7bdc4341ee310b8baf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
