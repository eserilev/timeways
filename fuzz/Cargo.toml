[package]
name = "timeways-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
fake-bridge = { path = "../crates/fake-bridge" }
libfuzzer-sys = "0.4"
mlua = { version = "0.12", features = ["lua51", "vendored"] }
rusty-hourglass = { git = "https://github.com/eserilev/rusty-hourglass", rev = "dea7d40918e20386dfb92eedf6c3a6c660fba321" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = "1"
serde_json = "1"
timeways-story = { path = "../crates/story" }

# Not a member of the main workspace: fuzzing needs nightly and libFuzzer.
[workspace]

[[bin]]
name = "input"
path = "fuzz_targets/input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "store"
path = "fuzz_targets/store.rs"
test = false
doc = false
bench = false

