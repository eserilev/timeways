[package]
name = "addon-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runs the Timeways addon in Lua 5.1 with a fake WoW API."
publish = false

[dev-dependencies]
fake-bridge = { path = "../fake-bridge" }
# The version range of the bridge, at the same pin as the transport copy (CI checks both).
protocol = { git = "https://github.com/eserilev/gnomish-relay", rev = "0a6d30b0714be8eea13e9273800eaef809f5d14b" }
mlua = { version = "0.12", features = ["lua51", "vendored"] }
proptest.workspace = true
serde_json.workspace = true
timeways-story = { path = "../story" }
timeways-dev = { path = "../dev" }
rusty-hourglass.workspace = true

[lints]
workspace = true
