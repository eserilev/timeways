# The game names of the people and places whose wiki name differs
# (docs/plans/lore-names-and-now.md 1). A row says that the exact names are one person
# or one place. Nothing else matches: no title is stripped, and no surname is enough.
# `wiki` is the name of the pack: the page title or the infobox name. `game` holds the
# unit name and the encounter name of the game.
# A person checks each row in the game. TESTING.md lists the rows that wait for a check.
# A game name never sits in two rows, and never is the wiki name of a row
# (`the_game_names_are_a_function`).

# Surnames of two people or more of the pack. Alone, such a word names no one, so the
# kill of one never tells the end of the other. With a title of the name, it names its
# person: "Emperor Thaurissan" is Dagran.
shared = ["Thaurissan", "Bronzebeard", "Fordring", "Mograine", "Blackhand"]

