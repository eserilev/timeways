# A paragraph of a wiki page with a later term goes out, because it tells of a time after
# 25 ADP. The books need no such list: they end before the later expansions.
#
# The later names live in data/later_names.txt, the one list that the pack builder and
# every check of model text read. A plain name never goes in `terms`: a test fails.
# This section holds only what the checks of model text must not refuse:
#   - `titles`: the expansions and the books. Their words also say other things, such as
#     "the black dragonflight" or "the war within".
#   - `classic_names`: names of 25 ADP whose wiki paragraphs go on to later stories. The
#     narrator may say them, and the pack still drops those paragraphs.
#   - `terms`: patterns of prose, as regular expressions. The match ignores case.
# A name matches whole words, with any marks between them, like a later name.
[later]
titles = [
    "Burning Crusade",
    "Wrath of the Lich King",
    "Warlords of Draenor",
    "World of Warcraft: Legion",
    "Battle for Azeroth",
    "Dragonflight",
    "War Within",
    "Before the Storm",
    "Edge of Night",
    "Dark Mirror",
]
classic_names = [
    "Bolvar",
    "Vol'jin",
    "Gilneas",
    "Worgen",
    "Blood elf",
    "blood elves",
    "Outland",
    "Anduin",
    "Varian",
    "Calia",
    "Lilian Voss",
    "Broken Isles",
    "Argus",
    "Lor'themar",
    "Halduron",
    "Windrunner Spire",
    "Deathstalkers",
    "Baine",
    "Kezan",
    "Bilgewater",
    "Uldum",
    "Tol Barad",
    "Saldean",
    # The raids from Molten Core on have not happened (GAMEPLAY.md 5.9), and Onyxia is a
    # secret. Their names stand in 25 ADP, so only the pack drops their paragraphs.
    "Onyxia",
    "Prestor",
    "Nefarian",
    "Blackwing",
    "C'Thun",
    "Scarab Wall",
    "Firelands",
    "Zandalar",
    "Ahn'Qiraj",
]
terms = [
    'patch \d',
    "expansion",
    # Teldrassil stands in 25 ADP. Only its burning is later.
    'burn\w*[^.]{0,60}Teldrassil',
    'Teldrassil[^.]{0,60}burn',
    # The titan, not the town of Tyr's Hand.
    'Tyr(?:[^\w\x27]|$)',
    'Clea\b',
    "File:",
    'banish\w*[^.]{0,40}Ragnaros',
    'Ragnaros[^.]{0,60}(banish|defeat|slain)',
    'Hakkar.{0,3}s defeat',
    "Hakkar returned",
    # The return of Hakkar comes after Molten Core (docs/plans/lore-names-and-now.md 3.2).
    'rebirth the Blood God',
    "war in Draenor",
    # The fake Thermaplugg of Gnomeregan comes with a later patch.
    "facsimile",
    "Deathwing's (return|defeat|emergence)",
    "war against Deathwing",
    'petrif',
    "Heroic mode",
    "third invasion",
    "Mathias Shaw reported",
    "killed Zalazane",
    "retook the isles",
    'Malygos[^.]{0,40}ley lines',
]

# A sentence of a wiki page that matches one of these goes out, because it talks about the
# game and not the world: players, levels, instances, quests, and loot. The narrator and
# `/lore` speak of the world only. The rest of its paragraph stays when it reads on its own
# (`game_talk.rs`).
[game]
terms = [
    'players?\b',
    "PvP",
    "PvE",
    'battlegrounds?',
    "instanced",
    'instances?\b',
    'raid dungeons?',
    'raid entrance',
    'micro[ -]dungeons?',
    '\d-man',
    '\bmobs?\b',
    '\bloot',
    'quest ?hubs?',
    'quest ?givers?',
    # A quest of the lore stays: "the quest" and "complete" mark the quest of the game.
    '\bthe quests?\b',
    '\bcomplet\w*[^.]{0,40}\bquests?\b',
    '\bquests?\b[^.]{0,40}\bcomplet',
    '\bturn(s|ed|ing)? in\b[^.]{0,40}\bquests?\b',
    '\bquests?\b[^.]{0,40}\bturn(s|ed|ing)? in\b',
    'quest ?lines?',
    'quest chains?',
    'connected with quests',
