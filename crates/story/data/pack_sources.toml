# The pages of the wiki dump that `timeways-pack from-dump` reads (GAMEPLAY.md 5.10).
# The builder runs on the computer of the player, so the repo holds no lore text, only this list.

# The dungeons and raids of the list, by the names of the game. A setup passage, such as
# "Gryan Stoutmantle sent adventurers to kill VanCleef", belongs to one of them.
instances = [
    "Ragefire Chasm",
    "Wailing Caverns",
    "The Deadmines",
    "Shadowfang Keep",
    "Blackfathom Deeps",
    "The Stockade",
    "Gnomeregan",
    "Razorfen Kraul",
    "Scarlet Monastery",
    "Razorfen Downs",
    "Uldaman",
    "Zul'Farrak",
    "The Temple of Atal'Hakkar",
    "Blackrock Depths",
    "Blackrock Spire",
    "Scholomance",
    "Stratholme",
]

# The History of Warcraft books of the game. Each chapter section of the index page lists
# its books as `* [[Page]]` lines. Every book passage is common knowledge in 25 ADP.
# Chapter VI tells of later expansions, so it stays out.
[books]
index = "History of Warcraft"
chapters = [
    "Chapter I: Mythos",
    "Chapter II: The New World",
    "Chapter III: The Doom of Draenor",
    "Chapter IV: Alliance And Horde",
    "Chapter V: Return of the Burning Legion",
]
# The source of a passage names the book without this part of the page title.
title_suffix = " (History of Warcraft)"

# Wiki pages. Only the listed sections go in, and a subsection only under a listed parent.
# `lead = true` adds the text before the first heading. A page with a place waits until
# the player visits the place.
[[pages]]
title = "Forsaken"
lead = false
sections = [
    "Introduction",
    "History",
    "Third War and aftermath",
    "Alliance with the Horde",
    "World of Warcraft",
    "Culture and people",
    "Free will",
    "True death",
]
common = true

[[pages]]
title = "Undercity"
lead = false
sections = ["History", "Legacy of the Damned", "World of Warcraft"]
common = true

[[pages]]
title = "Sylvanas Windrunner"
lead = false
sections = [
    "Biography",
    "Ranger-General of Silvermoon",
    "The Second War",
    "Invasion of the Undead Scourge",
    "Sylvanas the Banshee",
    "Return to Lordaeron",
    "The Dark Ranger",
    "Queen of the Forsaken",
    "Joining the Horde",
    "The Forsaken's dominion",
]
common = true


