# The template parts of a narrator line (docs/plans/narrator-templates.md, built
# 2026-10-06). The model writes one sentence of history, and the code builds the deed from
# these parts. The user approves every part, as with the samples. Every part follows the
# style guide (docs/plans/narrator-style.md).
#
# A slot is a word in braces: {hero}, {foe}, {killer}, {zone}, {item}, {mount_a}, {breed},
# {group}, {order}, {count}, {count_num}, {ordinal}, {level}, {quest}, {title}, {npc},
# {mark}, {led}. The renderer puts a capital at the start of each sentence, so "{Hero}"
# and "{hero}" are the same slot.
#
# The moments: kill, revenge_before, revenge, death, side_quest, class_quest, title, slap,
# mark, mount, epic_mount, item, level.
#
# A tag stops a doubled word: two parts of one line never share a tag. The tag "past"
# keeps "Now," away from a deed in the past tense ("Now, Hogger fell" reads wrong). A need is a fact
# that the part requires: there, order, dry, beast, undead, demon, dragonkin, elemental,
# weapon, worn, leads, breed, repeat, one, many. "one" and "many" are the number of the
# group, or of the group that the foe led.

# Names of a mount or an item that start with a vowel and take "a": "a Unicorn".
article_a = ["Uni", "Use", "One"]

# --- Connectives: an opener of the deed sentence. No connective is a shape of its own.

[[connective]]
id = "c.now"
text = "Now,"
tags = ["now", "opener", "past"]
moments = ["kill", "class_quest", "side_quest", "title", "mount", "epic_mount", "item", "level"]

[[connective]]
id = "c.there"
text = "There,"
tags = ["place", "opener"]
needs = ["there"]
moments = ["kill", "death", "slap", "item"]

[[connective]]
id = "c.in_zone"
text = "In {zone},"
tags = ["place", "opener"]
moments = ["kill", "death", "item"]

[[connective]]
id = "c.in_the_end"
text = "In the end,"
tags = ["end", "opener"]
moments = ["kill"]

[[connective]]
id = "c.at_last"
text = "At last,"
tags = ["last", "opener"]
moments = ["class_quest"]

# --- Deeds. A part with no {hero} is an unnamed part. A kill prefers an unnamed part.

[[deed]]
id = "k.fell"
moments = ["kill"]
text = "{Foe} fell to {hero}."
tags = ["past"]

[[deed]]
id = "k.defeated"
