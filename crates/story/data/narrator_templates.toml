one = "has grown stronger"
many = "have grown stronger"

# --- Codas: the level fact. "joined" follows ", and" after the grow verb.

[[coda]]
id = "co.reached"
alone = "{Hero} has reached level {level}."
joined = "{hero} has reached level {level}."

[[coda]]
id = "co.is_now"
alone = "{Hero} is level {level} now."
joined = "{hero} is level {level} now."
tags = ["now"]

[[coda]]
id = "co.makes_u"
alone = "That makes level {level}."

# A level line with no coda is the shape with no coda part ("co.none_u" of the plan).

