one = "{Led} has lost its leader."
many = "{Led} have lost their leader."
needs = ["leads"]

[[deed]]
id = "d.killed"
moments = ["death"]
text = "{Killer} has now killed {hero} {count}."
tags = ["now"]

[[deed]]
id = "d.died"
moments = ["death"]
text = "{Hero} has now died to {killer} {count}."
