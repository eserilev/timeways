[[deed]]
id = "m.left"
moments = ["mark"]
text = "{Quest} left {mark} on {hero}."

[[deed]]
id = "m.lingers_u"
moments = ["mark"]
text = "{Mark} lingers after {quest}."

[[deed]]
id = "mt.rides"
moments = ["mount", "epic_mount"]
text = "{Hero} rides {mount_a}."

[[deed]]
id = "mt.carries"
moments = ["mount", "epic_mount"]
text = "{Mount_a} carries {hero}."

[[deed]]
id = "mt.such"
moments = ["mount"]
text = "One such {breed} now carries {hero}."
needs = ["breed"]
tags = ["now"]

[[deed]]
id = "mt.such_u"
moments = ["mount"]
text = "One such {breed} has a new rider."
needs = ["breed"]

[[deed]]
id = "i.in_hand"
moments = ["item"]
text = "{Item} is in the hand of {hero}."
needs = ["weapon"]

[[deed]]
id = "i.carries"
moments = ["item"]
text = "{Hero} carries {item}."
needs = ["weapon"]

[[deed]]
id = "i.wears"
moments = ["item"]
text = "{Hero} wears {item}."
needs = ["worn"]

# --- The killer of a death: one named person, or one of many.

[[killer]]
id = "kr.one"
text = "{killer}"

[[killer]]
