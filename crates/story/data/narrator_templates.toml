text = "{Foe} did not win the {ordinal}."
needs = ["dry"]

[[deed]]
id = "rb.in_the_end"
moments = ["revenge"]
text = "In the end, {foe} fell to {hero}."

[[deed]]
id = "q.finished"
moments = ["side_quest", "class_quest"]
