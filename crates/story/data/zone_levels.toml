# The leveling path of Classic, for `timeways-pack coverage` (GAMEPLAY.md 5.10).
# Each place has the level range of its quests or its dungeon. The report goes through
# the places in the order of their lowest level, and each subzone follows its zone.
# The names are the names of the game. Only places within the cutoff of 5.9 are here:
# no raid from Molten Core on, so no raid at all for now.
#
# `kind` is "zone", "capital", or "dungeon". `within` is the zone outside a dungeon.

